<title>Subsidios al transporte: 6 a 1</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f3efe6;
  --surface: #fffdf8;
  --land: #e4dcc6;
  --land-line: #a79f88;
  --text: #1d2430;
  --muted: #5c6470;
  --line: #cfc8b6;
  --amba: #1b5fb0;
  --interior: #2f7d57;
  --coin: #e9b824;
  --coin-edge: #9c730a;
  --coin-mark: #7a5a06;
  --alert: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121820; --surface: #1a222d; --land: #2b3544; --land-line: #4b576a;
    --text: #eceae3; --muted: #a5adb8; --line: #36404d;
    --amba: #6fa9ec; --interior: #5cc78f; --coin: #f3c93e; --coin-edge: #b58c1a; --coin-mark: #7a5a06; --alert: #ff8077;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121820; --surface: #1a222d; --land: #2b3544; --land-line: #4b576a;
  --text: #eceae3; --muted: #a5adb8; --line: #36404d;
  --amba: #6fa9ec; --interior: #5cc78f; --coin: #f3c93e; --coin-edge: #b58c1a; --coin-mark: #7a5a06; --alert: #ff8077;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; line-height: 1.45; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 28px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.7rem, 5.4vw, 2.7rem); line-height: 1.08; margin: 0 0 6px; letter-spacing: -0.01em; }
.sub { margin: 0 0 16px; color: var(--muted); font-size: 1.02rem; max-width: 62ch; }
button { font: inherit; font-size: 0.92rem; padding: 8px 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 3px solid var(--amba); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
@media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 440px) 1fr; gap: 24px; } }
.stage { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
canvas { width: 100%; display: block; }
.side { display: flex; flex-direction: column; gap: 12px; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.months span { font-size: 0.72rem; text-align: center; padding: 4px 0; border-bottom: 4px solid var(--line); color: var(--muted); }
.months span.on { border-bottom-color: var(--amba); color: var(--text); font-weight: 600; }
.months span.mark { border-bottom-color: var(--alert); color: var(--alert); font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat .n { font-family: Georgia, serif; font-size: 2.2rem; font-weight: 700; line-height: 1; }
.stat .l { font-size: 0.86rem; color: var(--muted); margin-top: 4px; }
.stat.a .n { color: var(--amba); border-bottom: 0; }
.stat.i .n { color: var(--interior); }
.caption { min-height: 8.6em; margin: 0; padding: 12px 14px; border-left: 5px solid var(--line); background: var(--surface); font-size: 1.04rem; }
.caption.alert { border-left-color: var(--alert); }
.caption b { font-weight: 700; }
.pax h2 { font-family: Georgia, serif; font-size: 1.15rem; margin: 0; }
.paxsub { margin: 2px 0 8px; font-size: 0.88rem; color: var(--muted); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.foot { margin: 6px 0 0; font-size: 0.8rem; color: var(--muted); max-width: 72ch; }

.brandbar { display: flex; align-items: stretch; height: 72px; margin-top: 18px; background: #2ea494; overflow: hidden; }

  <h1>De cada 7 pesos, 6 van al AMBA</h1>
  <p class="sub">Subsidios al transporte en el Presupuesto nacional 2027. El séptimo peso se reparte entre las 23 provincias.</p>

        var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        x = SRC.x + (k.tx - SRC.x) * e; y = SRC.y + (k.ty - SRC.y) * e - 70 * Math.sin(Math.PI * e);
        if (p >= 1) { if (!k.done) { k.done = true; flash[k.id] = 1; } lI++; var q2 = (k.age - k.T) / 0.25; if (q2 < 1) s = 1 + 0.5 * (1 - q2); }
        else s = 1 + 0.25 * Math.sin(Math.PI * e);
      }
      drawCoin(ctx, x, y, s, R, c);
    }
    if (lA !== shownA) { shownA = lA; nA.textContent = lA; }
    if (lI !== shownI) { shownI = lI; nI.textContent = lI; }

    // borde de la zona y llaves
    if (lA > N_INT && !crossT) crossT = 0.001;
    if (crossT && !paused) crossT += dt;
    var pulse = crossT && crossT < 1.2 ? 1 - crossT / 1.2 : 0;
    ctx.strokeStyle = c.alert; ctx.lineWidth = 2 + 2.5 * pulse; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(PILE.x0 - 4, yTop); ctx.lineTo(PILE.x1 + 4, yTop); ctx.stroke();
    brace(ctx, PILE.x0 - 8, yTop, yBot, 9, -1, c.alert);
    ctx.fillStyle = c.alert; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('lo que reciben las 23', PILE.x0 - 22, (yTop + yBot) / 2 - 7);
    ctx.fillText('provincias en un año', PILE.x0 - 22, (yTop + yBot) / 2 + 7);

    // excedente: lo que el AMBA suma por encima de esa zona
    if (lA > N_INT) {
      var topY = PILE.floor - TA.cum[lA - 1];
      if (yTop - topY > 14) {
        brace(ctx, PILE.x1 + 8, topY, yTop - 2, 9, 1, c.amba);
        var txt = (yTop - topY >= 120) ? '+' + (lA - N_INT) + ' Pesos de más' : '+' + (lA - N_INT);
        ctx.save(); ctx.translate(PILE.x1 + 28, (topY + yTop) / 2); ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = c.amba; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 12px "Segoe UI", system-ui, sans-serif'; ctx.fillText(txt, 0, 0);
        ctx.restore();
      }
    }

    // rótulo del AMBA
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    var cxp = (PILE.x0 + PILE.x1) / 2;
    ctx.fillStyle = c.amba; ctx.font = '700 20px Georgia, serif'; ctx.fillText('AMBA', cxp, PILE.floor + 26);
    ctx.fillStyle = c.muted; ctx.font = '11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Capital + 24 partidos', cxp, PILE.floor + 42); ctx.fillText('del Conurbano', cxp, PILE.floor + 55);
    ctx.fillStyle = c.amba; ctx.font = '700 22px Georgia, serif'; ctx.fillText(pesos(lA), cxp, PILE.floor + 82);
    ctx.fillStyle = c.interior; ctx.font = '700 16px Georgia, serif';
    ctx.fillText('Resto del país', cxp, PILE.floor + 130);
    ctx.font = '700 22px Georgia, serif'; ctx.fillText(pesos(lI), cxp, PILE.floor + 156);
    ctx.fillStyle = c.muted; ctx.font = '11px "Segoe UI", system-ui, sans-serif'; ctx.fillText('un reparto entre 23 provincias', cxp, PILE.floor + 172);
  }

  function easeOutBack(p) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function drawPerson(ctx, cx, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, 48, 17, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, 120, 30, 40, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
  }
  function drawPerson2(dt, c) {
    var ctx = cPer;
    ctx.fillStyle = c.surface; ctx.fillRect(0, 0, PW, PH);
    if (t >= 12 && !paused) s2t += dt;           // arranca cuando termina el año
    var cxA = 112, cxI = 328, i, START = 0.6, GAP = 0.12, shA = 0, shI = 0, RR = 8.5;
    drawPerson(ctx, cxA, c.amba); drawPerson(ctx, cxI, c.interior);
    var started = t >= 12;
    for (i = 0; i < 18; i++) {
      var p = Math.max(0, Math.min(1, (s2t - (START + i * GAP)) / 0.28));
      if (!started || p <= 0) continue;
      shA++;
      drawCoin(ctx, cxA - 50 + (i % 6) * 20, 150 + Math.floor(i / 6) * 20, Math.max(0.01, easeOutBack(p)), RR, c);
    }
    var pi = Math.max(0, Math.min(1, (s2t - START) / 0.28));
    if (started && pi > 0) { shI = 1; drawCoin(ctx, cxI, 150, Math.max(0.01, easeOutBack(pi)), RR, c); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 24px Georgia, serif';
    ctx.fillStyle = c.amba; ctx.fillText(pesos(shA), cxA, 242);
    ctx.fillStyle = c.interior; ctx.fillText(pesos(shI), cxI, 242);
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = c.text;
    ctx.fillText('por usuario del AMBA', cxA, 266); ctx.fillText('por usuario del interior', cxI, 266);
    var endT = START + 17 * GAP + 0.45;
    if (started && s2t > endT) {
      ctx.globalAlpha = Math.min(1, (s2t - endT) / 0.5);
      ctx.fillStyle = c.alert; ctx.font = '700 38px Georgia, serif'; ctx.textBaseline = 'middle'; ctx.fillText('18 a 1', 220, 112);
      ctx.globalAlpha = 1;
      if (stage !== 's2done') {
        stage = 's2done';
        setCaption('Cada refuerzo de subsidios para el AMBA debería tener su equivalente por pasajero para el interior, incorporado al Presupuesto nacional, y el impuesto a los combustibles debería coparticiparse. <b>No se pide quitarle nada a nadie: se pide el mismo trato para todos los usuarios.</b>', true);
      }
    }
  }

  // ---------- bucle ----------
  var last = 0;
  function frame(ts) {
    var dt = Math.min((ts - last) / 1000 || 0, 0.05); last = ts;
    var c = { surface: css('--surface'), land: css('--land'), landLine: css('--land-line'), text: css('--text'), muted: css('--muted'),
      amba: css('--amba'), interior: css('--interior'), coin: css('--coin'), edge: css('--coin-edge'), mark: css('--coin-mark'), alert: css('--alert') };

    {
      if (!paused && t < 12) {
        t = Math.min(12, t + dt * MONTH_RATE * (reduced ? 2 : 1));
        var tgA = Math.min(N_AMBA, Math.floor(t * N_AMBA / 12)), tgI = Math.min(N_INT, Math.floor(t * N_INT / 12 + 0.5));
        while (spA < tgA) { spawnAmba(spA); spA++; }
        while (spI < tgI) { spawnProv(order[spI]); spI++; }
        var m = Math.min(11, Math.floor(t));
        for (var i = 0; i < 12; i++) monthSpans[i].className = i <= m ? (i === 1 && t >= 2 ? 'mark' : 'on') : '';
        if (t >= 2 && t < 12 && stage !== 's1two') {
          stage = 's1two';
          setCaption('<b>En dos meses, el AMBA ya recibió lo que todas las provincias juntas reciben en un año.</b> No es Rosario ni Córdoba: es el interior junto.', true);
        }
        if (t >= 12 && stage !== 's1end') {
          stage = 's1end';
          setCaption('Al cierre del año: <b>138 Pesos para el AMBA y 23 para el resto del país</b>, repartidos entre las 23 provincias. Seis a uno.', true);
        }
      }
      cMap.setTransform(1, 0, 0, 1, 0, 0); cMap.clearRect(0, 0, cvMap.width, cvMap.height);
      cMap.setTransform(kMap, 0, 0, kMap, 0, 0);
      drawMap(dt, c);
      cPer.setTransform(1, 0, 0, 1, 0, 0); cPer.clearRect(0, 0, cvPer.width, cvPer.height);
      cPer.setTransform(kPer, 0, 0, kPer, 0, 0);
      drawPerson2(dt, c);
    }
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
